name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  RAYON_NUM_THREADS: 4
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [openblas-system, netlib-system, 'openblas-system,cryspglib']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install numerical and plotting libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev gfortran gnuplot-nox
          if [[ '${{ matrix.features }}' == openblas* ]]; then
            sudo apt-get install -y libopenblas-dev
          fi
      - name: Expose Ubuntu's merged CBLAS library to netlib-src
        if: matrix.features == 'netlib-system'
        run: |
          mkdir -p "$RUNNER_TEMP/netlib-link"
          ln -s "$(cc -print-file-name=libblas.so)" "$RUNNER_TEMP/netlib-link/libcblas.so"
          echo "LIBRARY_PATH=$RUNNER_TEMP/netlib-link${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo check --all-targets --features '${{ matrix.features }}'
      - run: cargo test --release --features '${{ matrix.features }}'
      - name: Exhaustive symmetry release gates
        if: matrix.features == 'openblas-system,cryspglib' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        run: cargo test --release --features '${{ matrix.features }}' exhaustive_strict -- --ignored

  lint-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libopenblas-dev gfortran
      - run: cargo fmt --all -- --check
      # Existing style/complexity warnings remain visible while correctness
      # warnings and discarded Results are enforced immediately.
      - run: cargo clippy --all-targets --features openblas-system,cryspglib -- -D clippy::correctness -D unused_must_use
      - run: cargo doc --no-deps --features openblas-system,cryspglib
        env:
          RUSTDOCFLAGS: '-D warnings --html-in-header docs-header.html'

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: sudo apt-get update && sudo apt-get install -y libopenblas-dev gfortran
      - run: cargo check --all-targets --features openblas-system,cryspglib
